name: Deploy

# Publishes the marketing site: static export, CDK deployment of the site
# stack, upload to S3, CloudFront invalidation. The branch it runs from picks
# the environment: `staging` publishes staging, `main` publishes production.
# Authentication is OIDC only — no AWS keys are stored in this repository.
#
# Never triggered by a push. CI dispatches it once every check has passed on
# `staging` or `main`, so an untested revision is never published. Dispatching
# against the branch keeps the OIDC subject claim at
# `repo:elemwave@94376369/marketing-site@1349628253:ref:refs/heads/<branch>`,
# owner and repository ids included, which is what the
# deploy role trusts; a `workflow_run` trigger would run from the default
# branch instead.

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Commit SHA to deploy (defaults to the head of the dispatched ref)
        required: false
        type: string

concurrency:
  group: deploy-${{ github.ref_name }}
  # A newer staging revision supersedes the one in flight. Production waits
  # instead, so a publication is never cut off halfway through its upload.
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  id-token: write
  contents: read

env:
  AWS_ACCOUNT_ID: "663038650422"
  AWS_REGION: eu-west-1
  # CloudFront only accepts ACM certificates issued in us-east-1.
  CERTIFICATE_REGION: us-east-1
  NODE_VERSION: "24"
  # The revision CI verified, not whatever the branch points at by the time the
  # dispatch is picked up.
  RELEASE_SHA: ${{ inputs.target_sha || github.sha }}
  # Maintained by hand in the AWS account; its trust policy is what restricts
  # this workflow to the staging and main branches. See infra/README.md.
  DEPLOY_ROLE_ARN: arn:aws:iam::663038650422:role/github-action
  BASIC_AUTH_USERNAME_PARAMETER: /elemwave/website/staging/basic-auth/username
  BASIC_AUTH_PASSWORD_PARAMETER: /elemwave/website/staging/basic-auth/password

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    # Deliberately no `environment:`. Referencing one changes the OIDC subject
    # claim to `repo:elemwave@94376369/marketing-site@1349628253:environment:<name>`, which no
    # longer matches the branch-scoped trust policy of the deploy role.

    steps:
      - name: Select the environment for this branch
        run: |
          case "$GITHUB_REF_NAME" in
            staging) environment=staging ;;
            main) environment=production ;;
            *)
              echo "::error title=No environment for this branch::Deploy publishes from staging or main, not $GITHUB_REF_NAME"
              exit 1
              ;;
          esac
          {
            echo "ENVIRONMENT=$environment"
            echo "SITE_STACK=elemwave-website-$environment"
            echo "SITE_BUCKET=elemwave-website-$environment-site-$AWS_ACCOUNT_ID"
          } >> "$GITHUB_ENV"
          echo "Publishing $RELEASE_SHA to $environment"

      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            projects/marketing/package-lock.json
            infra/package-lock.json

      - name: Install site dependencies
        working-directory: projects/marketing
        run: npm ci

      - name: Build the static site
        working-directory: projects/marketing
        run: npm run build

      - name: Stamp the deployed revision
        working-directory: projects/marketing
        run: |
          printf '{"revision":"%s","builtAt":"%s"}\n' \
            "$RELEASE_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > out/version.json
          cat out/version.json

      - name: Install infrastructure dependencies
        working-directory: infra
        run: npm ci

      - name: Assume the deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify required SSM parameters
        if: env.ENVIRONMENT == 'staging'
        shell: bash
        run: |
          required=(
            "$BASIC_AUTH_USERNAME_PARAMETER"
            "$BASIC_AUTH_PASSWORD_PARAMETER"
          )
          missing=()
          for name in "${required[@]}"; do
            value="$(aws ssm get-parameter --name "$name" --with-decryption \
              --query 'Parameter.Value' --output text 2>/dev/null || true)"
            if [ -z "${value//[[:space:]]/}" ] || [ "$value" = "None" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Missing deployment parameters::Set these SSM parameters to a non-empty value before deploying: ${missing[*]}"
            exit 1
          fi
          echo "All ${#required[@]} required SSM parameters are present and non-empty."

      # Parameter Store owns the staging credentials; the synthesis needs their
      # real values because they are baked into the CloudFront Function.
      # Production is public and needs none.
      - name: Read the staging credentials from Parameter Store
        if: env.ENVIRONMENT == 'staging'
        run: |
          username=$(aws ssm get-parameter --name "$BASIC_AUTH_USERNAME_PARAMETER" --with-decryption --query Parameter.Value --output text)
          password=$(aws ssm get-parameter --name "$BASIC_AUTH_PASSWORD_PARAMETER" --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$username"
          echo "::add-mask::$password"
          echo "STAGING_BASIC_AUTH_USER=$username" >> "$GITHUB_ENV"
          echo "STAGING_BASIC_AUTH_PASSWORD=$password" >> "$GITHUB_ENV"

      # The content policy names the inline scripts it admits by hash, and it
      # changes before the new documents are uploaded and the cache refreshed.
      # Handing the synthesis the documents still published lets the policy
      # admit their scripts too, so those pages keep working until replaced.
      - name: Download the page documents currently published
        shell: bash
        run: |
          published="$RUNNER_TEMP/published-export"
          mkdir -p "$published"
          if ! head_output="$(aws s3api head-bucket --bucket "$SITE_BUCKET" 2>&1)"; then
            if [[ "$head_output" == *"404"* || "$head_output" == *"Not Found"* ]]; then
              echo "Nothing published yet in $SITE_BUCKET; the policy admits only the new build."
            else
              echo "::error title=Cannot read the published site::$head_output"
              exit 1
            fi
          else
            aws s3 sync "s3://$SITE_BUCKET" "$published" --exclude "*" --include "*.html" --only-show-errors
          fi
          echo "PUBLISHED_EXPORT_DIRECTORY=$published" >> "$GITHUB_ENV"

      # Idempotent: a bootstrapped environment is left untouched. Both regions
      # are covered because the certificate stacks live in us-east-1, even
      # though this workflow never deploys them.
      - name: Bootstrap the CDK environments
        working-directory: infra
        run: npx cdk bootstrap "aws://${AWS_ACCOUNT_ID}/${AWS_REGION}" "aws://${AWS_ACCOUNT_ID}/${CERTIFICATE_REGION}"

      - name: Deploy the site infrastructure
        working-directory: infra
        run: npx cdk deploy "$SITE_STACK" --require-approval never --outputs-file cdk-outputs.json

      - name: Read the stack outputs
        working-directory: infra
        run: |
          echo "DISTRIBUTION_ID=$(jq -r ".\"$SITE_STACK\".DistributionId" cdk-outputs.json)" >> "$GITHUB_ENV"
          echo "SITE_URL=$(jq -r ".\"$SITE_STACK\".SiteUrl" cdk-outputs.json)" >> "$GITHUB_ENV"

      # Fingerprinted assets first, so a page document is never published before
      # the assets it references exist.
      - name: Upload fingerprinted assets
        run: |
          aws s3 sync projects/marketing/out/_next/static "s3://$SITE_BUCKET/_next/static" \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload page documents
        run: |
          aws s3 sync projects/marketing/out "s3://$SITE_BUCKET" \
            --delete \
            --exclude "_next/static/*" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Refresh the CloudFront cache
        run: |
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" --paths "/*" \
            --query 'Invalidation.Id' --output text)"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" --id "$invalidation_id"
          echo "Invalidation $invalidation_id completed"

      # Verifies which revision answers, not merely that something does.
      - name: Verify the deployed revision
        shell: bash
        run: |
          credentials=()
          if [ "$ENVIRONMENT" = staging ]; then
            credentials=(--user "$STAGING_BASIC_AUTH_USER:$STAGING_BASIC_AUTH_PASSWORD")
          fi
          deployed="$(curl --show-error --silent --fail "${credentials[@]}" \
            "$SITE_URL/version.json" | sed -n 's/.*"revision":"\([^"]*\)".*/\1/p')"
          if [ "$deployed" != "$RELEASE_SHA" ]; then
            echo "::error title=Wrong revision deployed::$SITE_URL serves $deployed, expected $RELEASE_SHA"
            exit 1
          fi
          echo "$SITE_URL serves $deployed"

      - name: Report the published site
        run: echo "Published $RELEASE_SHA to $ENVIRONMENT at $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
