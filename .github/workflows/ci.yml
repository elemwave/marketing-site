name: CI

on:
  pull_request:
  push:
    branches: [staging, main]

concurrency:
  group: branch-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions: {}

# Every check job runs the make targets `make ci` runs, through the same
# containers, images and configuration, so CI and the local gate cannot
# disagree about a file. The jobs follow the gate's tiers, declared once in
# scripts/lib/ci-stages.sh: each job prepares as the prepare tier does, the
# cheap jobs run in parallel, and the verify jobs start only once every cheap
# job has passed. tools/ci-gate/tests/ci-parity.test.js holds this file to that
# declaration, so a stage added to the gate and not here fails the tests.

jobs:
  select-runner:
    name: Select runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      target: ${{ steps.runner.outputs.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions/select-runner
      - id: runner
        uses: ./.github/actions/select-runner
        with:
          requested-target: ${{ vars.ACTIONS_RUNNER_TARGET }}

  # --- Cheap tier ---

  lint:
    name: Lint
    needs: [select-runner]
    runs-on: &runner ${{ needs.select-runner.outputs.target == 'self' && 'self-hosted' || 'ubuntu-latest' }}
    permissions: &read_only
      contents: read
    steps:
      - &checkout
        name: Check out the repository
        uses: actions/checkout@v7
      - name: Prepare images and dependencies
        run: make ci-images deps deps-workspace
      - name: Lint
        run: make lint

  typecheck:
    name: Type-check
    needs: [select-runner]
    runs-on: *runner
    permissions: *read_only
    steps:
      - *checkout
      - name: Prepare images and dependencies
        run: make ci-images deps deps-workspace
      - name: Type-check the app and the infrastructure
        run: make typecheck

  shape:
    name: Shape
    needs: [select-runner]
    runs-on: *runner
    permissions: *read_only
    steps:
      - *checkout
      - name: Prepare images and dependencies
        run: make ci-images deps deps-workspace
      - name: File size
        run: make shape-size
      - name: Duplication
        run: make shape-duplication
      - name: Complexity
        run: make shape-complexity

  audit:
    name: Audit
    needs: [select-runner]
    runs-on: *runner
    permissions: *read_only
    steps:
      - *checkout
      - name: Prepare images and dependencies
        run: make ci-images deps deps-workspace
      - name: Dependency advisories
        run: make audit

  # --- Verify tier ---

  test-infrastructure:
    name: Infrastructure tests
    needs: [select-runner, lint, typecheck, shape, audit]
    runs-on: *runner
    permissions: *read_only
    steps:
      - *checkout
      - name: Prepare images and dependencies
        run: make ci-images deps deps-workspace
      - name: Infrastructure tests
        run: make test-infrastructure

  app:
    name: App tests, static export, browser tests and performance budget
    needs: [select-runner, lint, typecheck, shape, audit]
    runs-on: *runner
    permissions: *read_only
    steps:
      - *checkout
      - name: Prepare images and dependencies
        run: make ci-images deps deps-workspace
      - name: App tests with the coverage gates
        run: make test-app
      - name: Static export
        id: export
        run: make app-build
      - name: Browser tests
        run: make e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: projects/marketing/playwright-report
          retention-days: 7
      - name: Performance budget
        if: ${{ !cancelled() && steps.export.outcome == 'success' }}
        run: make performance-budget

  ci:
    name: CI
    if: ${{ !cancelled() }}
    needs: [select-runner, lint, typecheck, shape, audit, test-infrastructure, app]
    runs-on: *runner
    permissions: {}
    steps:
      - name: Fail if any check did not pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::A CI check did not pass"
          exit 1

  # Staging is published only from a revision that passed every check above.
  # Dispatched against the `staging` ref so the deploy's OIDC subject claim
  # still matches the branch-scoped trust policy of the deploy role.
  dispatch-staging-deploy:
    name: Dispatch staging deployment
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch the Deploy staging workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-staging.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f target_sha="$GITHUB_SHA"
          echo "Dispatched Deploy staging for $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
