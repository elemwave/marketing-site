name: CI

on:
  pull_request:
  push:
    branches: [staging, main]

concurrency:
  group: branch-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions: {}

env:
  # Maintained by hand in the AWS account, mirroring the deploy role. See
  # infra/README.md. Grants only ECR Public authentication, so the six check
  # jobs below acquire their images under identified-client quota rather than
  # the anonymous one.
  CI_IMAGES_ROLE_ARN: arn:aws:iam::663038650422:role/github-action-images

# Every check job runs the make targets `make ci` runs, through the same
# containers, images and configuration, so CI and the local gate cannot
# disagree about a file. The jobs follow the gate's tiers, declared once in
# scripts/lib/ci-stages.sh: each job prepares as the prepare tier does, the
# cheap jobs run in parallel, and the verify jobs start only once every cheap
# job has passed. tools/ci-gate/tests/ci-parity.test.js holds this file to that
# declaration, so a stage added to the gate and not here fails the tests.

jobs:
  select-runner:
    name: Select runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      target: ${{ steps.runner.outputs.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions/select-runner
      - id: runner
        uses: ./.github/actions/select-runner
        with:
          requested-target: ${{ vars.ACTIONS_RUNNER_TARGET }}

  # --- Cheap tier ---

  lint:
    name: Lint
    needs: [select-runner]
    runs-on: &runner ${{ needs.select-runner.outputs.target == 'self' && 'self-hosted' || 'ubuntu-latest' }}
    permissions: &read_only
      contents: read
      id-token: write
    steps:
      - &checkout
        name: Check out the repository
        uses: actions/checkout@v7
      - &aws-credentials
        name: Assume the CI images role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.CI_IMAGES_ROLE_ARN }}
          aws-region: us-east-1
      - &ecr-public-login
        name: Log in to Amazon ECR Public
        run: aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
      - name: Prepare images and dependencies
        run: make ci-images deps deps-workspace
      - name: Lint
        run: make lint

  typecheck:
    name: Type-check
    needs: [select-runner]
    runs-on: *runner
    permissions: *read_only
    steps:
      - *checkout
      - *aws-credentials
      - *ecr-public-login
      - name: Prepare images and dependencies
        run: make ci-images deps deps-workspace
      - name: Type-check the app and the infrastructure
        run: make typecheck

  shape:
    name: Shape
    needs: [select-runner]
    runs-on: *runner
    permissions: *read_only
    steps:
      - *checkout
      - *aws-credentials
      - *ecr-public-login
      - name: Prepare images and dependencies
        run: make ci-images deps deps-workspace
      - name: File size
        run: make shape-size
      - name: Duplication
        run: make shape-duplication
      - name: Complexity
        run: make shape-complexity

  audit:
    name: Audit
    needs: [select-runner]
    runs-on: *runner
    permissions: *read_only
    steps:
      - *checkout
      - *aws-credentials
      - *ecr-public-login
      - name: Prepare images and dependencies
        run: make ci-images deps deps-workspace
      - name: Dependency advisories
        run: make audit

  # --- Verify tier ---

  test-infrastructure:
    name: Infrastructure tests
    needs: [select-runner, lint, typecheck, shape, audit]
    runs-on: *runner
    permissions: *read_only
    steps:
      - *checkout
      - *aws-credentials
      - *ecr-public-login
      - name: Prepare images and dependencies
        run: make ci-images deps deps-workspace
      - name: Infrastructure tests
        run: make test-infrastructure

  app:
    name: App tests, static export, browser tests and performance budget
    needs: [select-runner, lint, typecheck, shape, audit]
    runs-on: *runner
    permissions: *read_only
    steps:
      - *checkout
      - *aws-credentials
      - *ecr-public-login
      - name: Prepare images and dependencies
        run: make ci-images deps deps-workspace
      - name: App tests with the coverage gates
        run: make test-app
      - name: Static export
        id: export
        run: make app-build
      - name: Browser tests
        run: make e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: projects/marketing/playwright-report
          retention-days: 7
      - name: Performance budget
        if: ${{ !cancelled() && steps.export.outcome == 'success' }}
        run: make performance-budget

  ci:
    name: CI
    if: ${{ !cancelled() }}
    needs: [select-runner, lint, typecheck, shape, audit, test-infrastructure, app]
    runs-on: *runner
    permissions: {}
    steps:
      - name: Fail if any check did not pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::A CI check did not pass"
          exit 1

  # A site is published only from a revision that passed every check above:
  # `staging` publishes staging, `main` publishes production. Dispatched
  # against the pushed branch so the deploy's OIDC subject claim still matches
  # the branch-scoped trust policy of the deploy role.
  dispatch-deploy:
    name: Dispatch deployment
    needs: [ci]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch the Deploy workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f target_sha="$GITHUB_SHA"
          echo "Dispatched Deploy from $GITHUB_REF_NAME for $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  # A failed or cancelled push to staging or main leaves that environment
  # behind its branch with no publication record. dispatch-deploy above keeps
  # its implicit success() gate on `ci`, so the two jobs are structurally
  # disjoint: a revision is never both published and recorded as unpublished.
  record-unpublished:
    name: Record an unpublished revision
    needs: [ci]
    if: ${{ always() && github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main') && (needs.ci.result == 'failure' || needs.ci.result == 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch the Deploy workflow in record mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f target_sha="$GITHUB_SHA" \
            -f mode=record
          echo "$GITHUB_SHA on $GITHUB_REF_NAME was not published: CI did not pass." >> "$GITHUB_STEP_SUMMARY"
