name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: branch-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions: {}

env:
  NODE_VERSION: "22"

jobs:
  select-runner:
    name: Select runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      target: ${{ steps.runner.outputs.target }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/actions/select-runner
      - id: runner
        uses: ./.github/actions/select-runner
        with:
          requested-target: ${{ vars.ACTIONS_RUNNER_TARGET }}

  lint:
    name: Lint the app
    needs: [select-runner]
    runs-on: &runner ${{ needs.select-runner.outputs.target == 'self' && 'self-hosted' || 'ubuntu-latest' }}
    permissions: &read_only
      contents: read
    steps:
      - &checkout
        name: Check out the repository
        uses: actions/checkout@v5
      - &setup_node
        name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            projects/marketing/package-lock.json
            infra/package-lock.json
      - &install_app
        name: Install the app dependencies
        working-directory: projects/marketing
        run: npm ci
      - name: ESLint
        working-directory: projects/marketing
        run: npm run lint

  typecheck-app:
    needs: [select-runner]
    name: Type-check the app
    runs-on: *runner
    permissions: *read_only
    steps:
      - *checkout
      - *setup_node
      - *install_app
      - name: TypeScript
        working-directory: projects/marketing
        run: npm run typecheck

  typecheck-infrastructure:
    needs: [select-runner]
    name: Type-check the infrastructure
    runs-on: *runner
    permissions: *read_only
    steps:
      - *checkout
      - *setup_node
      - &install_infrastructure
        name: Install the infrastructure dependencies
        working-directory: infra
        run: npm ci
      - name: TypeScript
        working-directory: infra
        run: npm run build

  test-app:
    name: Test the app
    needs: [select-runner, lint, typecheck-app, typecheck-infrastructure]
    runs-on: *runner
    permissions: *read_only
    steps:
      - *checkout
      - *setup_node
      - *install_app
      - name: Vitest with the coverage gates
        working-directory: projects/marketing
        run: npm run test:coverage

  test-infrastructure:
    name: Test the infrastructure
    needs: [select-runner, lint, typecheck-app, typecheck-infrastructure]
    runs-on: *runner
    permissions: *read_only
    steps:
      - *checkout
      - *setup_node
      - *install_infrastructure
      - name: Jest
        working-directory: infra
        run: npm test

  build:
    name: Build the static export
    needs: [select-runner, lint, typecheck-app, typecheck-infrastructure]
    runs-on: *runner
    permissions: *read_only
    steps:
      - *checkout
      - *setup_node
      - *install_app
      - name: Next.js production build
        working-directory: projects/marketing
        run: npm run build

  performance-budget:
    name: Performance budget
    needs: [select-runner, lint, typecheck-app, typecheck-infrastructure]
    runs-on: *runner
    permissions: *read_only
    steps:
      - *checkout
      - *setup_node
      - *install_app
      - name: Next.js production build
        working-directory: projects/marketing
        run: npm run build
      - name: Performance budget
        working-directory: projects/marketing
        run: npm run perf:budget

  shape:
    needs: [select-runner]
    name: Shape
    runs-on: *runner
    permissions: *read_only
    steps:
      - *checkout
      - *setup_node
      - *install_app
      - name: File size
        run: ./scripts/check-file-size-budgets.sh
      - name: Duplication
        run: ./scripts/check-duplication-budgets.sh
      - name: Complexity
        working-directory: projects/marketing
        run: npm run shape

  audit:
    name: Audit
    needs: [select-runner]
    runs-on: *runner
    permissions: *read_only
    steps:
      - *checkout
      - *setup_node
      - *install_app
      - name: Marketing dependencies
        working-directory: projects/marketing
        run: node ../../tools/audit-gate/run.js --scope marketing
      - *install_infrastructure
      - name: Infrastructure dependencies
        working-directory: infra
        run: node ../tools/audit-gate/run.js --scope infrastructure

  e2e:
    name: Browser tests
    needs: [lint, typecheck-app, typecheck-infrastructure]
    runs-on: *runner
    permissions: *read_only
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      HOME: /tmp
    steps:
      - *checkout
      - *install_app
      - name: Build the static export
        working-directory: projects/marketing
        run: npm run build
      - name: Playwright
        working-directory: projects/marketing
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: projects/marketing/playwright-report
          retention-days: 7

  ci:
    name: CI
    if: ${{ !cancelled() }}
    needs: [select-runner, lint, typecheck-app, typecheck-infrastructure, shape, audit, e2e, test-app, test-infrastructure, build, performance-budget]
    runs-on: *runner
    permissions: {}
    steps:
      - name: Fail if any check did not pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::A CI check did not pass"
          exit 1
