services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    working_dir: /app
    # Only make exports these; a bare `docker compose` still runs as root.
    user: '${HOST_UID:-0}:${HOST_GID:-0}'
    environment:
      HOME: /tmp
    command: sh -lc 'npm run dev -- -H 0.0.0.0'
    volumes:
      - './projects/marketing:/app'
      - 'app_node_modules:/app/node_modules'
    networks:
      - elemwave

  nginx:
    image: 'nginx:alpine'
    ports:
      - '80:80'
    volumes:
      - './docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro'
    depends_on:
      - app
    networks:
      - elemwave

networks:
  elemwave:
    driver: 'bridge'

volumes:
  app_node_modules:
